[project]
name = "cs-video-player"
version = "2.0.0"
description = "基于 cs-ui 的声明式本地视频播放器，深度参考 PotPlayer 交互逻辑与 VLC 全格式能力"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CS Video Player" }]
keywords = ["cs-ui", "video", "player", "desktop", "potplayer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
# cs-ui 只提供通用 UI 与设计令牌；视频后端（flet-video）由本项目自己持有 ——
# 播放器接管时间轴 / 音量 / 全屏 / 播放列表状态，不是一个通用控件。
# 版本区间与 cs-ui 锁定的 flet 1.1.x 对齐，避免协议层不一致。
dependencies = [
    "cs-ui>=0.2.0",
    "flet-video>=1.1.2,<1.2",
]

[project.urls]
Repository = "https://github.com/cs-video-player/cs-video-player"

[project.scripts]
cs-video-player = "cs_video_player.bootstrap:run"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# src 布局：包实体在 src/cs_video_player/ 下，从 src 根自动发现顶层包与全部子包，
# 以后新增子包不需要再改这里。根目录的 main.py 只是开发入口，不参与安装。
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cs_video_player*"]
exclude = ["tests*", "__pycache__*"]
